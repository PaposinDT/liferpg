name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static checks
        run: |
          python -m compileall -q backend/app backend/tests installer
          bash -n bootstrap.sh install.sh update.sh uninstall.sh scripts/*.sh
          python installer/validate_config.py config/founding.example.json config/install.example.json

      - name: Build dashboard
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package release
        run: |
          chmod +x bootstrap.sh install.sh update.sh uninstall.sh scripts/*.sh
          bash ./scripts/package_release.sh

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release/liferpg-*.zip \
              release/liferpg-*.tar.gz \
              release/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/liferpg-*.zip \
              release/liferpg-*.tar.gz \
              release/SHA256SUMS \
              --generate-notes \
              --title "Life RPG ${GITHUB_REF_NAME}"
          fi
