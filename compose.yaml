name: liferpg

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LIFERPG_API_BIND:-127.0.0.1}:8000:8000"

  bot:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.bot_main"]

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.scheduler_main"]

  dashboard:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${LIFERPG_DASHBOARD_BIND:-127.0.0.1}:8080:80"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    expose:
      - "11434"

volumes:
  pgdata:
  ollama:
